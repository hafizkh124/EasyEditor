<style>
  /* Option 1: 2 tabs + centred plus */
  .tb1 { flex: none; display: grid; grid-template-columns: 1fr 88px 1fr; align-items: end; padding: 6px 12px 10px; background: hsl(var(--card) / .94); backdrop-filter: blur(14px); border-block-start: 1px solid hsl(var(--border)); }
  /* Option 2: 4 tabs + centred plus */
  .tb2 { flex: none; display: grid; grid-template-columns: 1fr 1fr 76px 1fr 1fr; align-items: end; padding: 6px 4px 10px; background: hsl(var(--card) / .94); backdrop-filter: blur(14px); border-block-start: 1px solid hsl(var(--border)); }
  .tb1 a, .tb2 a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 11px; color: hsl(var(--muted-foreground)); min-block-size: 48px; position: relative; }
  .tb1 a svg.i, .tb2 a svg.i { font-size: 23px; } .tb1 a.on, .tb2 a.on { color: hsl(var(--primary)); font-weight: 600; }
  .tb1 a { font-size: 12px; }
  .bigplus { justify-self: center; inline-size: 60px; block-size: 60px; border-radius: 22px; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); display: grid; place-items: center; font-size: 28px; box-shadow: var(--shadow-lg); margin-block-end: 10px; border: 4px solid hsl(var(--background)); }
  .bigplus.open { transform: rotate(45deg); }
  .bdg { position: absolute; inset-block-start: 2px; inset-inline-end: calc(50% - 20px); min-inline-size: 17px; block-size: 17px; border-radius: 99px; background: hsl(var(--danger)); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding-inline: 4px; }
  .av { position: relative; } .av .dotn { position: absolute; inset-block-start: -1px; inset-inline-end: -1px; inline-size: 10px; block-size: 10px; border-radius: 50%; background: hsl(var(--danger)); border: 2px solid hsl(var(--card)); }
  .row-li { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-block-end: 1px solid hsl(var(--border)); min-block-size: 52px; }
  .optcard { padding: 18px 20px; border-radius: 20px; border: 1px solid hsl(var(--border)); background: hsl(var(--card)); display: flex; flex-direction: column; gap: 10px; max-inline-size: 1300px; }
  .pc { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; font-size: 13px; } .pc ul { margin: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 4px; }
  .jrow { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; border: 1px solid hsl(var(--border)); background: hsl(var(--card)); }
  .nti { display: flex; gap: 10px; padding: 12px; border-radius: 12px; } .nti.unread { background: hsl(var(--primary-soft) / .6); }
</style>
