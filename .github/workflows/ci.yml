name: CI

# The four gates SPEC-M5 §7 ("عمومی و کوڈ کوالٹی") requires, run on every
# change instead of only when someone remembers to run them locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must stay >=22: the dependency tree has moved past Node 20 —
      # better-sqlite3@13 (a native module), @supabase/supabase-js@2.111,
      # pdfjs-dist@5.7 and electron@43 all declare engines.node >=22.
      # release.yml already runs 22; leaving this on 20 made every job here
      # fail while the same commit passed locally on 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # SPEC-M5 FR-1.5/NFR-8: src/test/sharedRuntime.test.ts asserts that every
      # file in shared/ loads under Deno as well as Node, but its 11 cases are
      # `skipIf(!denoAvailable)` — so without this step they silently skipped on
      # every PR and the guarantee was only ever checked at release time, on a
      # tag, when it is far more expensive to fix. release.yml already installs
      # Deno for exactly this reason.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      # SPEC-M5 FR-1.5 / NFR-8 / risk R2: shared/ is imported by both Deno edge
      # functions and Node/Electron, so a runtime-specific reference in it
      # breaks one of the two at import time. The spec verifies this by grep;
      # this makes it binding. (The mirror copy under supabase/functions/ is
      # checked for staleness by src/test/documentChunks.test.ts.)
      - name: Guard shared/ against runtime-specific references
        run: npm run check:shared

      # The committed jar must match ShamelaHelper.java: an edited source with a
      # stale jar beside it silently ships the old helper, and Shamela search
      # and import both run through it (SPEC-M5 R26).
      - name: Check the Shamela helper jar is current
        run: npm run check:shamela-helper

      # Covers tsconfig.app.json AND tsconfig.node.json — until now the whole
      # electron/ main process had no typecheck at all.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Coverage rather than a bare run: the per-path thresholds in
      # vitest.config.ts are the gate. They are deliberately narrow — only paths
      # that move money or gate security carry a floor — so this fails on a real
      # regression, not on a global percentage drifting by a point.
      - name: Test
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Build
        run: npm run build
