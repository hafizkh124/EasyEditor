name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build & package
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyeditor-${{ matrix.target }}
          path: release/

  create-release:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate checksums
        run: |
          cd easyeditor-linux
          sha256sum * > ../checksums-linux.txt
          cd ../easyeditor-mac
          sha256sum * > ../checksums-mac.txt
          cd ../easyeditor-win
          sha256sum * > ../checksums-win.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            easyeditor-linux/*
            easyeditor-mac/*
            easyeditor-win/*
            checksums-*.txt
          generate_release_notes: true
