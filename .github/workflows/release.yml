name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # SPEC-M5 FR-1.5/NFR-8: shared/ must load under Deno as well as Node —
      # src/test/sharedRuntime.test.ts's Deno block only runs when `deno` is
      # on PATH, which is only true here (most local dev machines skip it).
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # --publish never: without this, electron-builder implicitly publishes
      # (creates/updates a GitHub release) the moment it sees a tag ref, once
      # per matrix OS — racing itself into duplicate/partial draft releases.
      # The create-release job below is the single, deliberate publish step.
      - name: Build & package
        run: npm run build:electron -- --publish never

      # TESTING-STRATEGY.md §5.5/§10 (P3): proves the build electron-builder
      # just packaged actually launches, before it becomes a release artifact.
      # `build:electron` leaves `dist/` and `dist-electron/` in place (it packages
      # FROM them; it does not consume them), which is what this test launches.
      - name: Install Xvfb (Linux only — Electron needs a display server here; macOS/Windows runners already have one)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Packaged app smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: Packaged app smoke test
        if: runner.os != 'Linux'
        run: npm run test:e2e

      # electron-builder leaves the unpacked app tree (linux-unpacked/,
      # win-unpacked/, mac-arm64/) in release/ alongside the installers. That
      # tree is exactly what the installers already contain, so uploading it
      # inflated each artifact to 415-853 MB and broke create-release's
      # `sha256sum *` ("Is a directory"). Take only the top-level files:
      # installers, their *.blockmap, and the latest*.yml that electron-updater
      # reads to find a new version — still written under `--publish never`,
      # since electron-builder gates that on `build.publish` being configured,
      # not on whether it is uploading.
      - name: Collect distributables
        shell: bash
        run: |
          mkdir -p dist-release
          shopt -s nullglob
          # Deliberately a bash glob loop, not `find -type f`: on the Windows
          # runner `find` can resolve to System32's FIND.EXE instead of Git
          # Bash's, and this step has to behave identically on all three OSes.
          for f in release/*; do
            [ -f "$f" ] || continue
            case "${f##*/}" in
              builder-debug.yml|builder-effective-config.yaml) continue ;;
            esac
            cp "$f" dist-release/
          done
          ls -l dist-release
          # A missing latest*.yml breaks auto-update silently: the app keeps
          # running, finds no feed, and every user stays on their old version
          # forever. Fail the release instead — the listing above says why.
          feed=(dist-release/latest*.yml)
          if [ ${#feed[@]} -eq 0 ]; then
            echo "::error::No latest*.yml collected — electron-updater would have no update feed."
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyeditor-${{ matrix.target }}
          path: dist-release/

  create-release:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate checksums
        run: |
          for target in linux mac win; do
            (cd "easyeditor-$target" && sha256sum -- * > "../checksums-$target.txt")
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            easyeditor-linux/*
            easyeditor-mac/*
            easyeditor-win/*
            checksums-*.txt
          generate_release_notes: true
